[project]
name = "payments"
authors = [
    { name = "Frappe Technologies Pvt Ltd", email = "hello@frappe.io"}
]
maintainers = [
    { name = "PayPilotLabs", email = "founder@paypilotlabs.com"}
]
description = "Payment gateway integrations for PayPilotLabs products"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "paytmchecksum~=1.7.0",
    "razorpay~=2.0.0",
    "stripe~=16.1.0",
    "braintree~=4.20.0",
    "pycryptodome>=3.18.0,<4.0.0",
    "gocardless-pro~=1.22.0",
    "setuptools==84.2.1",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py312"  # shortcut: highest the pinned ruff v0.2.0 knows; set py314 when ruff is bumped

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "RUF001", # string contains ambiguous unicode character
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[project.urls]
Repository = "https://github.com/paypilotlabs/paypilotlabs-payments.git"
"Bug Reports" = "https://github.com/paypilotlabs/paypilotlabs-payments/issues"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
